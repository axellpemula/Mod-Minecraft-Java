plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Tambahkan repository di sini hanya jika depend ke mod lain.
	// Loom sudah menambahkan repository penting untuk download Minecraft secara otomatis.
	// Lihat https://docs.gradle.org/current/userguide/declaring_repositories.html
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"wheel_of_adaptation" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Untuk ganti versi, lihat file gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. Secara teknis opsional, tapi hampir semua mod butuh ini.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom akan otomatis attach sourcesJar ke task RemapSourcesJar dan task "build"
	// jika baris ini ada.
	// Jika kamu hapus baris ini, sources tidak akan di-generate.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Konfigurasi publikasi maven
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// Lihat https://docs.gradle.org/current/userguide/publishing_maven.html untuk setup publishing.
	repositories {
		// Tambahkan repository untuk publish artifact kamu di sini.
		// Blok ini TIDAK sama fungsinya dengan blok di paling atas.
		// Repository di sini dipakai untuk publishing, bukan untuk mengambil dependencies.
	}
}
